name: zzzdm-filter

on:
  schedule:
    # 每 5 分钟跑一次（GitHub Actions 最小间隔即 5 分钟）
    # 想降低频率改这里，例如 '*/15 * * * *' 表示每 15 分钟
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # 支持手动触发，便于首次测试

# 同一时间只跑一个，避免并发重复推送
concurrency:
  group: zzzdm-filter
  cancel-in-progress: false

# 需要写权限才能把去重状态提交回仓库
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # 带图推送需下载图片再上传，耗时略长，给足余量
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 该项目零第三方依赖，无需 pip install
      - name: Run filter & push
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 云端直连 Telegram，无需代理；如需可填
          TG_PROXY: ''
          SRC_CHANNEL: zzzdm
        run: python src/service.py

      # 把去重状态提交回仓库，保证跨次运行不重复推送
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: update push state [skip ci]"
            git push
          fi
